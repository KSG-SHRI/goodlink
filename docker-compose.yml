services:
  app:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      LISTEN_ADDRESS: ":8080"
      DATABASE_URL: "postgres://readable_links:readable_links_dev@postgres:5432/readable_links?sslmode=disable"
      REDIS_URL: "redis://redis:6379/0"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?Set ADMIN_TOKEN in your .env file}"
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8080}"
      CACHE_TTL_SECONDS: "300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: readable_links
      POSTGRES_USER: readable_links
      POSTGRES_PASSWORD: readable_links_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U readable_links -d readable_links"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
